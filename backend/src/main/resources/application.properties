spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_study_planner?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-string-at-least-32-chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.origin=${CORS_ORIGIN:http://localhost:5173}
app.seed-demo=${SEED_DEMO:false}

# ---- Quartz Scheduler (persistent JDBC JobStore on the same MySQL database) ----
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=always
spring.quartz.jdbc.schema=classpath:quartz/quartz-tables-mysql.sql
spring.quartz.scheduler-name=StudyPlannerScheduler
spring.quartz.auto-startup=true
spring.quartz.wait-for-jobs-to-complete-on-shutdown=true
spring.quartz.overwrite-existing-jobs=false
spring.quartz.properties.org.quartz.threadPool.threadCount=5
spring.quartz.properties.org.quartz.jobStore.isClustered=false
spring.quartz.properties.org.quartz.jobStore.misfireThreshold=60000
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.StdJDBCDelegate
